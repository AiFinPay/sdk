# AiFinPay shadow mode for nginx — a second access log, nothing else.
#
# Include the `map` and `log_format` in the http {} context and the
# `access_log` line in the server {} (or location {}) you want to observe.
# Responses are untouched; ship.mjs turns the log into gate events.
#
# What is logged: time, the path WITHOUT its query string, the User-Agent and
# whether the request carried an AIFP header (a 0/1 flag — the receipt itself
# is never written to disk). Nothing about the client IP or cookies.

# http {} ───────────────────────────────────────────────────────────────────
map "$http_aifp_receipt$http_aifp_agent_id" $aifp_speaks_aifp {
    ""       0;
    default  1;
}

log_format aifp_shadow escape=json
    '{"at":"$time_iso8601","path":"$uri","ua":"$http_user_agent","aifp":$aifp_speaks_aifp}';

# server {} ─────────────────────────────────────────────────────────────────
# access_log /var/log/nginx/aifp-shadow.log aifp_shadow;
#
# Optional: tell the AiFinPay site check (and anyone reading headers) that a
# gate is observing this host. Same header the SDK gate sends in shadow mode.
# add_header AIFP-Mode shadow always;
