# AiFinPay shadow mode for nginx — a second access log and one header.
#
# Include the `map`s and `log_format` in the http {} context and the
# `access_log` / `add_header` lines in the server {} (or location {}) you want
# to observe. Bodies and statuses are untouched; ship.mjs turns the log into
# gate events.
#
# What is logged: time, the path WITHOUT its query string, the User-Agent and
# whether the request carried an AIFP header (a 0/1 flag — the receipt itself
# is never written to disk). Nothing about the client IP or cookies.

# http {} ───────────────────────────────────────────────────────────────────
map "$http_aifp_receipt$http_aifp_agent_id" $aifp_speaks_aifp {
    ""       0;
    default  1;
}

# HTML pages only: a Link to /llms.txt and /.well-known/x402.json, so an agent
# that opened the home page finds how to pay. An empty value adds no header,
# which is how every non-HTML response stays as it was.
map $sent_http_content_type $aifp_discovery_link {
    "~*^(text/html|application/xhtml\+xml)"  '</llms.txt>; rel="alternate"; type="text/markdown"; title="AI agents: access and payment", </.well-known/x402.json>; rel="describedby"; type="application/json"';
    default                                   "";
}

log_format aifp_shadow escape=json
    '{"at":"$time_iso8601","path":"$uri","ua":"$http_user_agent","aifp":$aifp_speaks_aifp}';

# server {} ─────────────────────────────────────────────────────────────────
# access_log /var/log/nginx/aifp-shadow.log aifp_shadow;
#
# The discovery Link (on by default in this template — delete the line to opt
# out). nginx drops inherited add_header lines in a location {} that has its
# own add_header, so repeat it there if you use add_header in a location.
add_header Link $aifp_discovery_link always;
#
# Optional: tell the AiFinPay site check (and anyone reading headers) that a
# gate is observing this host. Same header the SDK gate sends in shadow mode.
# add_header AIFP-Mode shadow always;
