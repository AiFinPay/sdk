[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aifinpay-agent"
version = "2.2.1"
description = "Unified agent-economy SDK for autonomous AI agents — chain-opaque AiFinPayAgent surface (call/balance/verify) over Polygon and Solana execution environments. Non-custodial, x402-native."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "CoinSecurities (SECCO)", email = "contact@aifinpay.io" },
]
keywords = [
  "ai-agent", "ai-agents", "agentic-ai", "autonomous-agents",
  "agent-payments", "agent-commerce",
  "x402", "mcp", "model-context-protocol",
  "payments", "crypto-payments",
  "polygon", "solana", "stablecoin", "usdc",
  "non-custodial", "ed25519",
  "stripe-for-ai-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "PyNaCl>=1.5",
  "base58>=2.1",
  "requests>=2.28",
  # Unified dual-chain surface (Phase 1+):
  "web3>=6.0",
  "eth-account>=0.10",
  "solders>=0.20",
]

[project.optional-dependencies]
# Legacy install without the EVM/Solana heavy deps. Imports only the
# original Agent (Solana-only x402 flow) and skips AiFinPayAgent.
legacy = [
  "PyNaCl>=1.5",
  "base58>=2.1",
  "requests>=2.28",
]
dev = [
  "ruff>=0.6",
  "black>=24.0",
]

[project.urls]
Homepage = "https://aifinpay.io"
Documentation = "https://aifinpay.io/docs"
Repository = "https://github.com/AiFinPay/sdk"
Issues = "https://github.com/AiFinPay/sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aifinpay*"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = """
(
  | dist
  | build
  | \\.git
  | \\.tox
  | \\.venv
  | __pycache__
  | \\.egg-info
)
"""

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
