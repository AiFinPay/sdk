name: predeploy-sdk-v13-codemod
on:
  push:
    branches: [rebase/remediation-onto-main]
permissions:
  contents: write
jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebase/remediation-onto-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic SDK patch
        run: node scripts/predeploy-sdk-v13-codemod.mjs
      - name: Show exact source diff
        run: git diff -- node/src/unifiedAgent.ts node/src/aifp1.ts
      - name: Commit patched source to PR branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add node/src/unifiedAgent.ts node/src/aifp1.ts
          git commit -m "fix(sdk): wire durable budgets and v1.3 gross expiry ABI"
          git push origin HEAD:rebase/remediation-onto-main
