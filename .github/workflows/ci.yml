name: CI

# Release gate for the AiFinPay SDK monorepo.
# The Node matrix below is the supported set — 22, 24 and 26 — not a local
# machine's version. Python is pinned to 3.13. Requires no secrets.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stable required-check names predate the Node matrix. These summaries pass
  # only when every matrix leg succeeds; cancelled/skipped/failed legs fail.
  node-sdk-required:
    name: node — @aifinpay/agent (build + test)
    if: ${{ always() }}
    needs: [node-sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Node version
        env:
          MATRIX_RESULT: ${{ needs.node-sdk.result }}
        run: test "$MATRIX_RESULT" = success

  mcp-server-required:
    name: mcp — @aifinpay/mcp (build)
    if: ${{ always() }}
    needs: [mcp-server, mcp-against-source]
    runs-on: ubuntu-latest
    steps:
      - name: Require both source-cohort SDK matrices
        env:
          COHORT_RESULT: ${{ needs.mcp-server.result }}
          SOURCE_RESULT: ${{ needs.mcp-against-source.result }}
        run: |
          test "$COHORT_RESULT" = success
          test "$SOURCE_RESULT" = success

  version-gate:
    name: version bumped when published files change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history back to the merge base to compare versions.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
        run: node scripts/check-version-bump.mjs "$BASE_REF"

  node-sdk:
    name: node — @aifinpay/agent (build + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a bad
      # upstream release cannot silently redden CI with no change on our side.
      # The lockfile was stale — missing @solana/web3.js and its whole subtree —
      # and has been regenerated; keep it in sync or this step fails loudly,
      # which is the point.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject high and critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high

      # Installed canonical npm inputs must reproduce all SDK tables (offline).
      - name: Registry — generated tables match installed canonical registries
        run: npm run registry:check

      - name: Test registry package provenance gate
        run: node --test scripts/check-registry-provenance.test.mjs

      # Inputs are transformed aggregates, not vendored upstream contract files.
      # Verify the exact canonical npm tarball against locked SHA-512 and compare
      # all three generator inputs byte-for-byte. Fail closed on npm outage/drift.
      # Contract-source reproducibility and on-chain attestation are separate.
      - name: Registry — installed inputs match canonical npm package integrity
        run: node scripts/check-registry-provenance.mjs

      - name: Build (tsc)
        run: npm run build

      - name: Test (vitest)
        run: npm test

      # Catches a broken `files`/exports config before it reaches npm.
      - name: Verify publishable tarball
        run: npm pack --dry-run

  wallet:
    name: wallet — @aifinpay/wallet (build + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      # @aifinpay/agent is not installed here, so the live byte-identity test in
      # tests/wallet.test.ts reports as skipped. Derivation is held to the full
      # SDK by vectors pinned in tests/cli-and-derivation.test.ts — an agent
      # funded from a drifted address would be unspendable.
      - name: Test (vitest)
        run: npm test
      - name: Verify publishable tarball
        run: npm pack --dry-run

  mcp-server:
    name: mcp — @aifinpay/mcp (build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Checkout reviewed canonical skill source (not a moving branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AiFinPay/skill
          ref: b3fe28285befe0a1fb48a047fe5733bff975e854
          path: .ci/skill-source

      - name: Build same-commit agent producer
        working-directory: node
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Byte-preserving fixed registry bootstrap plus genuine paired source
      # All installs stay disposable; this cannot authorize publication.
      - name: Source-cohort integrity guard tests
        working-directory: .
        run: node --test scripts/check-mcp-source-cohort.test.mjs

      - name: Build and test genuine packed Node 2.6 + skill 2.9 cohort
        working-directory: .
        env:
          AIFP_COHORT_EVIDENCE: ${{ runner.temp }}/mcp-source-cohort.json
        run: node scripts/check-mcp-source-cohort.mjs .ci/skill-source

  # Independent packed-package integration matrix also tests the same source
  # cohort. Neither matrix is standalone registry release evidence until
  # agent2.6.0 and skill2.9.0 are published and the MCP dependency/lock is refreshed.
  mcp-against-source:
    name: mcp — built against the agent in this commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Checkout reviewed canonical skill source (not a moving branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AiFinPay/skill
          ref: b3fe28285befe0a1fb48a047fe5733bff975e854
          path: .ci/skill-source

      - name: Build same-commit agent producer
        working-directory: node
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Independent packed-package matrix uses the same strict source guard.
      # All installs stay disposable; this cannot authorize publication.
      - name: Source-cohort integrity guard tests
        working-directory: .
        run: node --test scripts/check-mcp-source-cohort.test.mjs

      - name: Build and test genuine packed Node 2.6 + skill 2.9 cohort
        working-directory: .
        env:
          AIFP_COHORT_EVIDENCE: ${{ runner.temp }}/mcp-source-cohort.json
        run: node scripts/check-mcp-source-cohort.mjs .ci/skill-source

  python-sdk:
    name: python — aifinpay-agent (install + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package + test deps
        run: python -m pip install -e . pytest

      - name: Test (pytest)
        run: python -m pytest tests -q

  python-gate:
    name: python — aifinpay-gate (install + pytest + Node parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build the Node gate the fixtures are recorded from
        working-directory: gate
        run: npm ci && npm run build

      - name: Parity fixture matches the Node gate
        working-directory: python-gate
        run: node scripts/gen-parity-fixtures.mjs --check

      - name: Install package + test deps
        working-directory: python-gate
        # Reporting tests drive real Flask/FastAPI apps and the payer client in ../python.
        run: python -m pip install -e . -e ../python pytest flask fastapi httpx

      - name: Test (pytest)
        working-directory: python-gate
        run: python -m pytest tests -q

  examples-syntax:
    name: examples — syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Cheap parse-only gate. Examples are not built or installed in CI;
      # this only guarantees the shipped reference bridges are valid JS.
      - name: node --check reference bridges
        run: |
          files=$(find examples mcp-http -maxdepth 2 \( -name 'server.js' -o -name 'store.js' \) -not -path '*/node_modules/*' | sort)
          for f in $files; do
            echo "checking $f"
            node --check "$f"
          done
