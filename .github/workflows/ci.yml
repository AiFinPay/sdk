name: CI

# Release gate for the AiFinPay SDK monorepo.
# Every job here was verified to pass locally (Node 20.20.2, Python 3.13)
# before being committed. Requires no secrets.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-gate:
    name: version bumped when published files change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the merge base to compare versions.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
        run: node scripts/check-version-bump.mjs "$BASE_REF"

  node-sdk:
    name: node — @aifinpay/agent (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a bad
      # upstream release cannot silently redden CI with no change on our side.
      # The lockfile was stale — missing @solana/web3.js and its whole subtree —
      # and has been regenerated; keep it in sync or this step fails loudly,
      # which is the point.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (tsc)
        run: npm run build

      - name: Test (vitest)
        run: npm test

      # Catches a broken `files`/exports config before it reaches npm.
      - name: Verify publishable tarball
        run: npm pack --dry-run

  wallet:
    name: wallet — @aifinpay/wallet (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      # The byte-identity test imports @aifinpay/agent (a devDependency). It is
      # the check that keeps this package's derivation from drifting away from
      # the full SDK — an agent funded from a drifted address would be
      # unspendable.
      - name: Test (vitest)
        run: npm test
      - name: Verify publishable tarball
        run: npm pack --dry-run

  mcp-server:
    name: mcp — @aifinpay/mcp (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      # Lockfile regenerated alongside node/ — `npm ci` keeps it authoritative.
      # Note: mcp depends on the *published* @aifinpay/agent from npm, not on
      # the sibling node/ directory, so this job validates the MCP server
      # against the released SDK.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (tsc)
        run: npm run build

      - name: Syntax-check bin entrypoint
        run: node --check bin/aifinpay-mcp.js

      - name: Verify publishable tarball
        run: npm pack --dry-run

      # mcp/ had no test files when this job was written, and the note saying so
      # outlived the fact. tests/ now holds 43 of them, all covering SSRF on the
      # claim-self and fetch paths, and none had ever run here.
      - name: Test (vitest)
        run: npm test

  # The job above installs @aifinpay/agent from the registry, which is the right
  # thing for validating a release — but it means a breaking change in node/ is
  # invisible until after it is published, and on a release commit it fails for
  # a third reason: the version mcp/ now asks for does not exist on npm yet.
  # That is what turned run 31308715367 red.
  #
  # This job answers the other question: does the MCP server still build against
  # the agent code in THIS commit? Packed and installed as a tarball rather than
  # linked, so it exercises the same file list npm publish would ship.
  mcp-against-source:
    name: mcp — built against the agent in this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and pack the agent from source
        working-directory: node
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm pack --pack-destination /tmp

      - name: Build the MCP server against it
        working-directory: mcp
        run: |
          npm ci --no-audit --no-fund
          # Overwrite the registry copy with the one just built. --no-save so
          # the lockfile stays authoritative for the release job.
          npm install --no-save --no-audit --no-fund /tmp/aifinpay-agent-*.tgz
          npm run build
          npm test

  python-sdk:
    name: python — aifinpay-agent (install + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package + test deps
        run: python -m pip install -e . pytest

      - name: Test (pytest)
        run: python -m pytest tests -q

  examples-syntax:
    name: examples — syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cheap parse-only gate. Examples are not built or installed in CI;
      # this only guarantees the shipped reference bridges are valid JS.
      - name: node --check reference bridges
        run: |
          files=$(find examples mcp-http -maxdepth 2 \( -name 'server.js' -o -name 'store.js' \) -not -path '*/node_modules/*' | sort)
          for f in $files; do
            echo "checking $f"
            node --check "$f"
          done
