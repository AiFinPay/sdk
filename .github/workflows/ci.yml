name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-gate:
    name: version bumped when published files change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
        run: node scripts/check-version-bump.mjs "$BASE_REF"

  node-sdk:
    name: node — @aifinpay/agent (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      - name: Test (vitest)
        run: npm test
      - name: Verify publishable tarball
        run: npm pack --dry-run

  mcp-server:
    name: mcp — @aifinpay/mcp (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (tsc)
        run: npm run build
      - name: Test security regressions (vitest)
        run: npm test
      - name: Build against this PR's Node SDK
        run: |
          (cd ../node && npm ci --no-audit --no-fund && npm run build)
          npm install --no-save --package-lock=false ../node
          npm run build
          npm test
      - name: Syntax-check bin entrypoint
        run: node --check bin/aifinpay-mcp.js
      - name: Verify publishable tarball
        run: npm pack --dry-run

  python-sdk:
    name: python — aifinpay-agent (install + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Test (pytest)
        run: python -m pytest tests -q

  examples-syntax:
    name: examples — syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check reference bridges
        run: |
          files=$(find examples mcp-http -maxdepth 2 \( -name 'server.js' -o -name 'store.js' \) -not -path '*/node_modules/*' | sort)
          for f in $files; do
            echo "checking $f"
            node --check "$f"
          done
