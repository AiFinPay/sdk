name: aifinpay
displayName: AiFinPay
description: Payment infrastructure for AI agents. A persistent non-custodial agent wallet, Agent Passport resolution, route discovery and non-signing settlement invoices; with owner-set limits, payable_fetch buys prepaid access to AIFP-1 merchants on Polygon or Base, in POL/ETH or a pinned stablecoin.
version: 2.5.0
license: MIT
homepage: https://aifinpay.io
repository: https://github.com/AiFinPay/sdk
documentation: https://aifinpay.io/docs
author: CoinSecurities (SECCO)
contact: hello@aifinpay.io

icon: https://aifinpay.io/favicon.png

categories:
  - payments
  - web3
  - agent-tools

tags:
  - payments
  - ai-agents
  - payment-infrastructure
  - aifp-1
  - polygon
  - stablecoins
  - usdc
  - non-custodial
  - agent-passport
  - settlement

startCommand:
  type: stdio
  command: npx
  args:
    - "@aifinpay/mcp"

runtime:
  node: ">=22"

configSchema:
  type: object
  properties:
    SEED_HASH:
      type: string
      title: Seed hash (hex)
      description: 32-byte seed encoded as 64 hex characters (optionally 0x-prefixed). Passed directly to AiFinPayAgent.fromSeed. Highest priority wallet source.
    AIFINPAY_AGENTS_FILE:
      type: string
      title: Agents file path
      description: Path to a JSON file containing an agents array with id and seed_hash fields. Use with AIFINPAY_AGENT_ID to select a specific agent.
    AIFINPAY_AGENT_ID:
      type: string
      title: Agent ID
      description: Select a specific agent from the agents file when multiple entries exist.
    AIFINPAY_AGENT_SECRET:
      type: string
      title: Agent secret (base58)
      description: Legacy Ed25519 secret for the agent identity. The Solana, EVM and Casper addresses derive deterministically from it. With no wallet source the server uses an ephemeral identity that must not be funded. Signing happens locally inside the MCP process; the secret is never transmitted to AiFinPay servers.
    AIFINPAY_HOME:
      type: string
      title: Wallet home directory
      description: Directory of the agent.json keystore written by `npx @aifinpay/mcp init` (default ~/.aifinpay).
    AIFINPAY_WALLET_PASSPHRASE:
      type: string
      title: Wallet passphrase
      description: Passphrase for an encrypted agent.json keystore. Without it an encrypted keystore cannot be opened and the server does not start.
    AIFINPAY_PAYMENTS_ENABLED:
      type: string
      title: Enable payments
      description: Set to "1" to register payable_fetch. Requires a persistent wallet and AIFINPAY_MAX_USD, AIFINPAY_DAILY_USD, AIFINPAY_GATEWAY_ORIGINS and a gas cap (AIFINPAY_MAX_GAS, or AIFINPAY_MAX_GAS_POL on Polygon); the server refuses to start if any is missing. Unset or "0" keeps the server read-only.
    AIFINPAY_MAX_USD:
      type: string
      title: Max USD per payment
      description: Per-payment cap for payable_fetch. Required when payments are enabled; there is no default. A tool argument can lower it for one call, never raise it.
    AIFINPAY_DAILY_USD:
      type: string
      title: Max USD per 24 hours
      description: Rolling 24-hour spending cap for payable_fetch. Required when payments are enabled.
    AIFINPAY_GATEWAY_ORIGINS:
      type: string
      title: Payable origins
      description: Comma-separated exact HTTPS origins the agent may pay (no wildcards). Required when payments are enabled.
    AIFINPAY_GATEWAY_PATH_MODE:
      type: string
      title: Gateway path mode
      description: "Use gateway for merchant-slug identity or direct for full request-path identity."
      default: gateway
    AIFINPAY_PAY_CHAIN:
      type: string
      title: Payment chain
      description: '"polygon" (default) or "base". Set by the owner; a quote for any other chain is refused.'
    AIFINPAY_MAX_GAS:
      type: string
      title: Gas cap (native)
      description: Gas cap per payment in the payment chain's native currency, for example "0.3" POL on Polygon or "0.0002" ETH on Base. Required when payments are enabled (or AIFINPAY_MAX_GAS_POL on Polygon).
    AIFINPAY_MAX_GAS_POL:
      type: string
      title: Gas cap (POL, Polygon only)
      description: The gas cap under its original name, in POL. Accepted on Polygon; refused on Base rather than read as ETH.
    AIFINPAY_PAY_ASSET:
      type: string
      title: Payment asset
      description: The chain's native currency (default; POL or ETH) or a stablecoin the SDK pins for that chain, such as "USDC". Gas is paid in the native currency either way.
    AIFINPAY_RPC_URL:
      type: string
      title: RPC for the payment chain
      description: Optional HTTPS RPC for the payment chain; defaults to its public RPC.
    AIFINPAY_BASE_URL:
      type: string
      title: API base URL
      description: Override the AiFinPay backend. Unset, read-only tools use https://aifinpay.io and payable_fetch quotes and receipts use https://api.aifinpay.io.
    AIFINPAY_TIMEOUT_MS:
      type: string
      title: Request timeout (ms)
      description: SDK request timeout in milliseconds.
      default: "30000"
    AIFINPAY_MODE:
      type: string
      title: Runtime mode
      description: '"live" (default) or "dev". Dev exposes dev_payment_quote, needs a non-production AIFINPAY_BASE_URL and cannot be combined with payments.'
    AIFINPAY_TRUSTED_HOSTS:
      type: string
      title: Trusted hosts
      description: Exact hosts allowed to skip the DNS pre-check, for environments that resolve only through a proxy.
    AIFINPAY_CLAIM_ORIGINS:
      type: string
      title: Claim origins
      description: Comma-separated origins agent_claim_self may contact. Defaults to the aifinpay.io dashboard and API origins; override only for staging.
    AIFINPAY_ALLOW_PRIVATE_FETCH:
      type: string
      title: Allow private fetch
      description: Set to "1" to enable local-development network access. Never enable on public hosted MCP.
  required: []

tools:
  - name: agent_address
    description: Return the agent's on-chain identities (Solana, EVM and Casper) derived from the configured wallet. Read-only.
  - name: agent_reload
    description: Reload the configured local wallet files after init or a file update, without starting a new conversation. Returns public addresses only.
  - name: agent_claim_self
    description: Link the agent to its owner's AiFinPay dashboard with a one-time URL from dash.aifinpay.io. Signs only an AiFinPay claim challenge for the agent's own address; moves no funds.
  - name: payable_fetch
    description: Registered only when the owner enables payments. Fetches a GET resource from an owner-approved AIFP-1 merchant, buys a prepaid batch through verified Polygon v1.4 within the owner's limits, and reuses its receipt. scope "merchant" buys one batch for the whole site.
  - name: agent_quota
    description: How many prepaid requests this agent has left, per service. Lists active quota batches (merchant, resource, used, remaining, expiry). Read-only.
  - name: agent_history
    description: Read an agent's payment history by EVM address, public passport identifier, or both. Transactions are indexed AiFinPay Polygon settlements.
  - name: agent_passport_resolve
    description: Resolve an AiFinPay Agent Passport by @username, permanent AIFP number, or immutable agent id. Returns verified public wallet bindings only.
  - name: settlement_routes
    description: Read AiFinPay's runtime-verified settlement routes. AIFP-1 is merchant monetisation (99% merchant / 1% AiFinPay / 0% creator). AIFP-2/x402 is 100% provider.
  - name: settlement_invoice
    description: Build and validate a non-signing EVM settlement invoice. This tool never moves funds.
  - name: settlement_solana
    description: Build and validate a non-signing Solana settlement invoice. This tool never moves funds.
  - name: settlement_casper
    description: Build and validate a non-signing Casper settlement invoice. This tool never moves funds.
  - name: deployment_info
    description: AiFinPay deployment details across EVM, Solana and Casper — addresses, stablecoins, program IDs and settlement status. Read-only.

