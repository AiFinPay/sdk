name: aifinpay
displayName: AiFinPay
description: Non-custodial AiFinPay payment and quote tools for AI agents. Fund-moving paths fail closed unless operator spend limits, trusted pricing, and canonical audited deployment targets are verified.
version: 1.0.0
license: MIT
homepage: https://aifinpay.io
repository: https://github.com/AiFinPay/sdk
documentation: https://aifinpay.io/docs
author: AiFinPay
contact: hello@aifinpay.io

icon: https://aifinpay.io/favicon.png

categories:
  - payments
  - agent-tools

tags:
  - payments
  - ai-agents
  - x402
  - non-custodial
  - payment-infrastructure

startCommand:
  type: stdio
  command: npx
  args:
    - "@aifinpay/mcp"

runtime:
  node: ">=20"

configSchema:
  type: object
  properties:
    AIFINPAY_AGENT_SECRET:
      type: string
      title: Agent secret
      description: Local wallet credential. Omit only for an unfunded ephemeral testing identity. Signing remains local to the MCP process.
    AIFINPAY_MAX_USD:
      type: string
      title: Max USD per call
      description: Mandatory positive finite operator ceiling for fund-moving tools. Tool/model arguments can tighten but never widen it.
    AIFINPAY_BASE_URL:
      type: string
      title: Trusted AiFinPay origin
      description: Trusted AiFinPay backend/registry origin.
      default: https://aifinpay.io
  required:
    - AIFINPAY_MAX_USD

tools:
  - name: agent_call
    description: Registry-resolved provider call. Any payment is refused unless operator spend limits and canonical target verification pass.
  - name: payable_fetch
    description: Fetch a URL and handle a supported 402 only after request-bound authorization, value checks and payment-target validation pass.
  - name: agent_address
    description: Return locally derived wallet identities. No funds move.
  - name: agent_quote
    description: Inspect a 402 challenge without paying.
  - name: pay_with_split
    description: Fee-on-top settlement tool. Legacy fee-inclusive splitters and not-yet-audited deployments are rejected.
  - name: quote_split
    description: Preview fee-on-top payment components without signing.

productionSupportPolicy: >-
  A chain or asset is production-supported only when the exact published artifact
  is mapped to the canonical deployment registry, runtime-verified, covered by
  reproducible E2E tests, and approved by the final security audit.
